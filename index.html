    <script>
      // Defensive guard for sandboxed environments where window.fetch is getter-only
      try {
        if (typeof window !== 'undefined' && window.fetch) {
          const originalFetch = window.fetch.bind(window);
          let currentFetch = originalFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get() {
                return currentFetch;
              },
              set(fn) {
                currentFetch = typeof fn === 'function' ? fn : originalFetch;
              },
              configurable: true,
              enumerable: true,
            });
          } catch (e) {
            // Fail safely if descriptor cannot be modified
          }
        }
      } catch (err) {
        // Silently continue
      }
    </script>
